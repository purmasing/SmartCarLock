# Keep the broker inaccessible until device credentials, TLS and ACLs are provisioned.
# Public listener (SIM800) – requires valid CA cert trusted and verified by modem.
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
certfile /etc/letsencrypt/live/mqtt.smartcarlock.ir/fullchain.pem
keyfile /etc/letsencrypt/live/mqtt.smartcarlock.ir/privkey.pem
# Local backend loopback auth uses same password_file and ACL.
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
